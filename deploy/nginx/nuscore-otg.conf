# Nu Score On the Go — location snippet for the 10.91.16.86 server blocks.
#
# Installed at /etc/nginx/snippets/nuscore-otg.conf and included by the two
# server blocks that own the server IP:
#   port 80  -> /etc/nginx/conf.d/nbfc-toolbox.conf
#   port 443 -> /etc/nginx/conf.d/newspaper.conf
#
# The port-80 block sets proxy_redirect / X-Forwarded-Prefix / proxy_cookie_path
# for /100Apps and a 20m body limit at server level. Every location below
# re-declares those so this app is not affected.
#
# Install:
#   sudo cp deploy/nginx/nuscore-otg.conf /etc/nginx/snippets/
#   add "include /etc/nginx/snippets/nuscore-otg.conf;" to both server blocks
#   sudo nginx -t && sudo systemctl reload nginx

location = /nuscore_claudecode {
    return 301 /nuscore_claudecode/;
}

# Any other capitalisation goes to the canonical path.
location ~* ^/nuscore_claudecode(/.*)?$ {
    return 301 /nuscore_claudecode$1;
}

location ^~ /nuscore_claudecode/ {
    # Internal networks only. No application login exists.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;

    # Uploads up to 20 GB stream straight to disk in the app.
    client_max_body_size     20g;
    client_body_timeout      600s;
    proxy_request_buffering  off;

    proxy_pass         http://127.0.0.1:8096/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Prefix /nuscore_claudecode;
    proxy_redirect     off;
    proxy_cookie_path  off;

    # Long-running requests (sync training for the mobile app, PDF reports).
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering    off;

    add_header X-Robots-Tag           "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;

    access_log /var/log/nginx/nuscore-otg.access.log;
    error_log  /var/log/nginx/nuscore-otg.error.log;
}
